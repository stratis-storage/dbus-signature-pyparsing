[build-system]
requires = [
    "setuptools>=77.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "dbus-signature-pyparsing"
description = "dbus signature parser"
authors = [
    { name = "Anne Mulhern", email = "amulhern@redhat.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyparsing",
]
dynamic = [
    "version",
]
license = "Apache-2.0"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/stratis-storage/dbus-signature-pyparsing"

[tool.setuptools]
packages = [
    "dbus_signature_pyparsing",
]
platforms = [
    "Linux",
]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic.version]
attr = "dbus_signature_pyparsing._version.__version__"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "F", "PL"]

[tool.ruff.lint.isort]
known-first-party = ["hs_dbus_signature"]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
