[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "F", "PL"]

[tool.ruff.lint.isort]
known-first-party = ["hs_dbus_signature"]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
